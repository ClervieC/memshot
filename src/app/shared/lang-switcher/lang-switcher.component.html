<div class="lang-dropdown" [class.open]="open" (clickOutside)="open = false">
  <button class="lang-btn" (click)="open = !open">
    <span>{{ langService.currentLang() === 'fr' ? '🇫🇷 FR' : '🇬🇧 EN' }}</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>
  <div class="lang-menu" *ngIf="open">
    <button class="lang-option" [class.active]="langService.currentLang() === 'fr'" (click)="select('fr')">
      🇫🇷 Français
    </button>
    <button class="lang-option" [class.active]="langService.currentLang() === 'en'" (click)="select('en')">
      🇬🇧 English
    </button>
  </div>
</div>
