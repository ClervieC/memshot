<div class="gallery-page">
      <header>
        <div class="header-left">
          <button class="icon-btn" (click)="goBack()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
          </button>
          <div class="header-info" *ngIf="event()">
            <span class="event-name">{{ event()!.name }}</span>
            <span class="photo-count">{{ photos().length }} photo{{ photos().length !== 1 ? 's' : '' }}</span>
          </div>
        </div>

        <div class="header-right">
          <div class="live-badge" *ngIf="photos().length > 0">
            <span class="live-dot"></span>
            Live
          </div>
          <button class="btn-camera" (click)="goToCamera()" *ngIf="!isAdmin()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </button>
          <button class="btn-dashboard" (click)="router.navigate(['/admin/dashboard'])" *ngIf="isAdmin()">
            Dashboard
          </button>
        </div>
      </header>

      <div class="loading-state" *ngIf="loading()">
        <div class="spin"></div>
      </div>

      <div class="empty-gallery" *ngIf="!loading() && photos().length === 0">
        <div class="empty-icon">
          <svg viewBox="0 0 64 64" fill="none">
            <rect x="8" y="8" width="48" height="48" rx="8" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="22" cy="22" r="5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 44l14-14 10 10 8-8 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h3>Aucune photo encore</h3>
        <p *ngIf="!isAdmin()">Soyez le premier à prendre une photo !</p>
        <button class="btn-take-first" (click)="goToCamera()" *ngIf="!isAdmin()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          Prendre une photo
        </button>
      </div>

      <div class="photo-grid" *ngIf="photos().length > 0">
        <div class="photo-item" *ngFor="let photo of photos()" (click)="openPhoto(photo)">
          <img [src]="photo.url" [alt]="photo.uploaderName || 'Photo'" loading="lazy" />
          <div class="photo-overlay">
            <span class="uploader-name" *ngIf="photo.uploaderName">{{ photo.uploaderName }}</span>
          </div>
        </div>
      </div>

      <!-- Fab camera button -->
      <button class="fab" (click)="goToCamera()" *ngIf="!isAdmin() && photos().length > 0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>

      <!-- Lightbox -->
      <div class="lightbox" *ngIf="lightboxPhoto()" (click)="closeLightbox()">
        <button class="lb-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <img [src]="lightboxPhoto()!.url" (click)="$event.stopPropagation()" />
        <div class="lb-caption" *ngIf="lightboxPhoto()!.uploaderName">
          Par {{ lightboxPhoto()!.uploaderName }}
        </div>
      </div>
    </div>
