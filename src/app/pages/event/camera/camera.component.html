<div class="camera-page">

  <!-- Camera view -->
  <div class="camera-view" *ngIf="!cameraError()">
    <video #videoEl autoplay playsinline muted class="video-feed" [class.mirror]="facingMode === 'user'"></video>

    <div class="camera-top">
      <button class="icon-btn" (click)="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </button>
      <span class="camera-title">{{ eventName() }}</span>
      <button class="icon-btn" (click)="switchCamera()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 4v6h6"/>
          <path d="M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
      </button>
    </div>

    <!-- Flash overlay -->
    <div class="capture-flash" *ngIf="captureFlash()"></div>

    <div class="camera-bottom">
      <!-- Thumbnail preview slot (always in DOM to stabilise grid) -->
      <div class="capture-thumb-slot">
        <div class="capture-thumb"
             *ngIf="thumbnailUrl()"
             [class.uploading]="thumbnailUploading()"
             [class.success]="thumbnailSuccess()"
             [class.fading]="thumbnailFading()">
          <img [src]="thumbnailUrl()" alt="" />
          <div class="thumb-ring"></div>
          <div class="thumb-check" *ngIf="thumbnailSuccess()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
        </div>
      </div>

      <button class="capture-btn" (click)="capture()">
        <div class="capture-inner"></div>
      </button>

      <div class="upload-alt">
        <label class="upload-label">
          <input type="file" accept="image/*" (change)="onFileSelect($event)" (click)="onGalleryClick()" hidden />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          {{ 'CAMERA.GALLERY_BTN' | translate }}
        </label>
      </div>
    </div>

    <!-- Error toast -->
    <div class="upload-toast error" *ngIf="uploadError()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {{ 'CAMERA.ERROR_UPLOAD' | translate }}
    </div>

    <canvas #canvasEl style="display:none"></canvas>
  </div>

  <!-- Camera not available -->
  <div class="no-camera" *ngIf="cameraError()">
    <svg viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="1.5"/>
      <line x1="48" y1="16" x2="16" y2="48" stroke="currentColor" stroke-width="1.5"/>
      <path d="M20 24v16h24V24l-4-4H24z" stroke="currentColor" stroke-width="1.5"/>
    </svg>
    <h3>{{ 'CAMERA.NO_CAMERA_TITLE' | translate }}</h3>
    <p>{{ 'CAMERA.NO_CAMERA_DESC' | translate }}</p>
    <label class="btn-gallery">
      <input type="file" accept="image/*" (change)="onFileSelect($event)" hidden />
      {{ 'CAMERA.CHOOSE_GALLERY' | translate }}
    </label>
  </div>

</div>
