<div class="reset-page">
  <div class="bg-shapes">
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
  </div>

  <div class="form-wrap">
    <div class="brand reveal" style="animation-delay: 0ms">
      <div class="dot"></div>
      <span>{{ 'APP_NAME' | translate }}</span>
    </div>

    <h2 class="reveal" style="animation-delay: 60ms">{{ 'RESET_PASSWORD.TITLE' | translate }}<br><em>{{ 'RESET_PASSWORD.TITLE_EM' | translate }}</em></h2>

    <div class="form reveal" style="animation-delay: 120ms" *ngIf="!success()">
      <div class="field">
        <label>{{ 'RESET_PASSWORD.PASSWORD_LABEL' | translate }}*</label>
        <input type="password" [(ngModel)]="password" placeholder="••••••••" />
      </div>
      <div class="field">
        <label>{{ 'RESET_PASSWORD.CONFIRM_LABEL' | translate }}*</label>
        <input type="password" [(ngModel)]="confirmPassword" placeholder="••••••••" (keyup.enter)="submit()" />
      </div>

      <div class="error" *ngIf="error()">{{ error() }}</div>

      <button class="btn-submit" (click)="submit()" [disabled]="loading()">
        <span *ngIf="!loading()">{{ 'RESET_PASSWORD.SUBMIT' | translate }}</span>
        <span *ngIf="loading()" class="spinner"></span>
      </button>
    </div>

    <div class="form reveal" style="animation-delay: 120ms" *ngIf="success()">
      <div class="success">{{ 'RESET_PASSWORD.SUCCESS' | translate }}</div>
      <button class="btn-submit" (click)="goToLogin()">{{ 'RESET_PASSWORD.GO_LOGIN' | translate }}</button>
    </div>
  </div>
  <div class="lang-wrap">
    <app-lang-switcher></app-lang-switcher>
  </div>
</div>
