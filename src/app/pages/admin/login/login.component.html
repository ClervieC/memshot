<div class="login-page">
      <div class="back" (click)="router.navigate(['/'])">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </div>

      <div class="form-wrap">
        <div class="brand">
          <div class="dot"></div>
          <span>{{ 'APP_NAME' | translate }}</span>
        </div>

        <h2>{{ 'LOGIN.TITLE' | translate }}<br><em>{{ 'LOGIN.TITLE_EM' | translate }}</em></h2>

        <div class="tabs" *ngIf="mode() !== 'forgot'">
          <button [class.active]="mode() === 'login'" (click)="mode.set('login')">{{ 'LOGIN.TAB_LOGIN' | translate }}</button>
          <button [class.active]="mode() === 'register'" (click)="mode.set('register')">{{ 'LOGIN.TAB_REGISTER' | translate }}</button>
        </div>

        <div class="form" *ngIf="mode() !== 'forgot'">
          <div class="field">
            <label>{{ 'LOGIN.EMAIL' | translate }}*</label>
            <input type="email" [(ngModel)]="email" placeholder="{{ 'LOGIN.EMAIL_PLACEHOLDER' | translate }}" />
          </div>
          <div class="field">
            <label>{{ 'LOGIN.PASSWORD' | translate }}*</label>
            <input type="password" [(ngModel)]="password" placeholder="{{ 'LOGIN.PASSWORD_PLACEHOLDER' | translate }}" />
          </div>

          <div class="error" *ngIf="error()">{{ error() }}</div>

          <button class="btn-submit" (click)="submit()" [disabled]="loading()">
            <span *ngIf="!loading()">{{ mode() === 'login' ? ('LOGIN.SUBMIT_LOGIN' | translate) : ('LOGIN.SUBMIT_REGISTER' | translate) }}</span>
            <span *ngIf="loading()" class="spinner"></span>
          </button>

          <div class="forgot-link" *ngIf="mode() === 'login'" (click)="showForgotPassword()">
            {{ 'LOGIN.FORGOT_PASSWORD' | translate }}
          </div>
        </div>

        <div class="form" *ngIf="mode() === 'forgot'">
          <ng-container *ngIf="!resetSent()">
            <div class="field">
              <label>{{ 'LOGIN.EMAIL' | translate }}*</label>
              <input type="email" [(ngModel)]="email" placeholder="{{ 'LOGIN.EMAIL_PLACEHOLDER' | translate }}" />
            </div>

            <div class="error" *ngIf="error()">{{ error() }}</div>

            <button class="btn-submit" (click)="submit()" [disabled]="loading()">
              <span *ngIf="!loading()">{{ 'LOGIN.SEND_RESET_LINK' | translate }}</span>
              <span *ngIf="loading()" class="spinner"></span>
            </button>
          </ng-container>

          <div class="success" *ngIf="resetSent()">{{ 'LOGIN.RESET_LINK_SENT' | translate }}</div>

          <div class="forgot-link" (click)="mode.set('login')">
            {{ 'LOGIN.BACK_TO_LOGIN' | translate }}
          </div>
        </div>
      </div>
      <div class="lang-wrap">
        <app-lang-switcher></app-lang-switcher>
      </div>
    </div>
